name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spend
          POSTGRES_PASSWORD: spend
          POSTGRES_DB: spendwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spend -d spendwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the test-suite runs against REAL PostgreSQL and Redis here (SQLite + in-memory cache locally)
      TEST_DATABASE_URL: postgresql+psycopg2://spend:spend@localhost:5432/spendwise_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Generate synthetic data
        run: python scripts/generate_data.py
      - name: Run tests
        run: python -m pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t spendwise-ai .
